name: macos-diag

# Manual diagnostic only: builds the unit tests on macOS, runs them with
# per-assertion output and, if they stall, dumps thread stacks.
on:
  workflow_dispatch:
  push:
    branches: [mtfix23-sync]

jobs:
  diag:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Probe flock vs fcntl semantics
        shell: bash
        run: |
          cat > probe.cpp <<'PROBE_EOF'
          #include <fcntl.h>
          #include <sys/file.h>
          #include <unistd.h>
          #include <cstdio>
          #include <cerrno>
          #include <cstring>
          #include <sys/wait.h>
          static int lk(int fd,int type,off_t off){struct flock f{};f.l_type=type;f.l_whence=SEEK_SET;f.l_start=off;f.l_len=1;int r=::fcntl(fd,F_SETLK,&f);return r==0?0:errno;}
          static void unl(int fd,off_t off){struct flock f{};f.l_type=F_UNLCK;f.l_whence=SEEK_SET;f.l_start=off;f.l_len=1;::fcntl(fd,F_SETLK,&f);}
          int main(){
           const off_t O=0x40000000;
           const char* p="probe.dat";
           int fd1=open(p,O_RDWR|O_CREAT|O_TRUNC,0644); write(fd1,"x",1);
           int fd2=open(p,O_RDWR);
           printf("A flock SH on fd1, then F_WRLCK on fd1: errno=%d\n",(flock(fd1,LOCK_SH|LOCK_NB),lk(fd1,F_WRLCK,O)));unl(fd1,O);
           printf("B flock SH on fd1, then F_WRLCK on fd2: errno=%d\n",lk(fd2,F_WRLCK,O));unl(fd2,O);
           printf("C flock SH on fd1, then F_RDLCK on fd2: errno=%d\n",lk(fd2,F_RDLCK,O));unl(fd2,O);
           flock(fd1,LOCK_UN);
           printf("D flock released, F_WRLCK on fd1: errno=%d\n",lk(fd1,F_WRLCK,O));unl(fd1,O);
           printf("E fcntl WRLCK held on fd1, then flock SH NB on fd2: rc=%d errno=%d\n",(lk(fd1,F_WRLCK,O),flock(fd2,LOCK_SH|LOCK_NB)),errno);
           flock(fd2,LOCK_UN);unl(fd1,O);
           int fd3=open(p,O_RDWR);
           flock(fd2,LOCK_SH|LOCK_NB);
           printf("F two fds flock SH (fd2,fd1), F_WRLCK on fd3: errno=%d\n",(flock(fd1,LOCK_SH|LOCK_NB),lk(fd3,F_WRLCK,O)));
           pid_t c=fork(); if(c==0){ int r=lk(fd1,F_WRLCK,O); printf("G child proc F_WRLCK while parent fds hold flock SH: errno=%d\n",r); _exit(0);} int st; waitpid(c,&st,0);
           return 0;}
          PROBE_EOF
          clang++ -std=c++17 -o probe probe.cpp
          ./probe
          sw_vers
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        run: cmake --preset default
      - name: Build
        run: cmake --build build/default --config Release --target openads_unit_tests
      - name: Run unit tests with stall dump
        shell: bash
        run: |
          BIN=$(find build -name openads_unit_tests -type f -perm -u+x | head -1)
          echo "binary: $BIN"
          cd "$(dirname "$BIN")"
          script -q "$GITHUB_WORKSPACE/run.log" ./openads_unit_tests -tce='*[slow]*,*flaky*' -s --no-colors > /dev/null 2>&1 &
          SP=$!
          for i in $(seq 1 56); do
            sleep 10
            if ! kill -0 $SP 2>/dev/null; then echo "finished early at ~$((i*10))s"; break; fi
          done
          if kill -0 $SP 2>/dev/null; then
            echo "=== STILL RUNNING after ~560s: stall dump"
            PID=$(pgrep -f './openads_unit_tests' | grep -v "^$SP$" | tail -1)
            echo "test pid: $PID"
            ps -o pid,stat,%cpu,etime,command -p "$PID" || true
            echo "=== last 40 lines of output"
            tail -n 40 "$GITHUB_WORKSPACE/run.log" | tr -d '\r' | cat -v | cut -c1-200 || true
            echo "=== lock timeouts in output"
            tr -d '\r' < "$GITHUB_WORKSPACE/run.log" | grep -c 'byte lock wait' || true
            tr -d '\r' < "$GITHUB_WORKSPACE/run.log" | grep -n -B6 'byte lock wait' | cut -c1-200 | head -40 || true
            echo "=== tests started"
            tr -d '\r' < "$GITHUB_WORKSPACE/run.log" | grep -c '^TEST CASE' || true
            echo "=== lsof (tmp files)"
            lsof -p "$PID" 2>/dev/null | grep -i openads | cut -c1-200 | head -40 || true
            echo "=== all processes"
            ps -axo pid,ppid,stat,etime,command | grep -i openads | grep -v grep | cut -c1-200 || true
            echo "=== lldb backtraces"
            sudo lldb -p "$PID" -b -o 'thread backtrace all' > "$GITHUB_WORKSPACE/lldb.txt" 2>&1 || true
            tr -d '\r' < "$GITHUB_WORKSPACE/lldb.txt" | cat -v | cut -c1-220 | head -120
            echo "=== sample"
            sudo sample "$PID" 5 -file "$GITHUB_WORKSPACE/sample.txt" > /dev/null 2>&1 || true
            tr -d '\r' < "$GITHUB_WORKSPACE/sample.txt" | cat -v | cut -c1-200 | head -100
            echo "=== end of dump"
            kill -9 "$PID" || true
          else
            echo "=== finished; tail of output"
            tail -n 30 "$GITHUB_WORKSPACE/run.log" | tr -d '\r' | cat -v | cut -c1-200 || true
          fi
